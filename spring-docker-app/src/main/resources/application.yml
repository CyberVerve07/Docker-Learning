
# server port
server:
  port: 8080

# custom app values — read in controller using @Value("${app.name}")
app:
  name: spring-docker-app
  version: 1.0.0

spring:
  application:
    name: spring-docker-app

# actuator → free health check endpoint at /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
